name: Weekly Service Health

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live service
        run: node scripts/preflight.cjs --live
      - name: Report content priorities
        run: node scripts/content-report.cjs
      - name: Report monetization readiness
        run: node scripts/monetization-report.cjs
