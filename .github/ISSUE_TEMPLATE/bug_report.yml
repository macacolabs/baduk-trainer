name: 버그 신고
description: 바둑판, 오목판, 학습 문제, 모바일 화면 오류를 신고합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        문제를 빠르게 재현할 수 있도록 사용 환경과 재현 순서를 적어주세요.
  - type: dropdown
    id: area
    attributes:
      label: 문제가 생긴 영역
      options:
        - 바둑 배우기
        - 바둑 대국
        - 오목 대국
        - AI 대국
        - 모바일 화면
        - 학습 글
        - 배포/접속
        - 기타
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 기기와 브라우저
      description: 예: iPhone Safari, Android Chrome, Windows Chrome
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 어떤 버튼을 누르고 어떤 화면에서 문제가 생겼는지 적어주세요.
      placeholder: |
        1. AI 대국으로 이동
        2. 오목 선택
        3. 중앙 근처를 터치
        4. 돌이 다른 위치에 놓임
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
